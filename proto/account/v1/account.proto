syntax = "proto3";

// Sylva Hub — identity / device-enrollment plane. Distinct from the app-data
// platform (`sylva.platform.v1`): the Hub is core infrastructure, not a
// registered app. Server discovery (`/.well-known/sylva-discovery`) is REST,
// not gRPC, so it is not modeled here. See docs/design/hub.md.
//
// Auth (this slice): the client sends the password over TLS and the server
// verifies it against a server-side Argon2id verifier (OPAQUE is a later
// hardening). Key-wrapping is separate and client-side: the master key is
// wrapped under KDF(password, secret_key) (1Password-style 2SKD); the server
// stores only the ciphertext + public keys + the verifier — never the password
// long-term, the Secret Key, the master key, or any private key.
package sylva.account.v1;

message Empty {}

// The user's wrapped key bundle — ciphertext + public keys only.
message KeyMaterial {
  bytes x25519_public = 1;            // receives wrapped content keys
  bytes ed25519_public = 2;           // signature verification
  bytes x25519_private_wrapped = 3;   // wrapped by the master key
  bytes ed25519_private_wrapped = 4;  // wrapped by the master key
  // Master key wrapped by KEK = Argon2id(password, secret_key) — the only copy.
  bytes master_key_wrapped = 5;
  bytes kdf_salt = 6;                 // salt for the wrapping KDF
  string kdf_params = 7;              // JSON: Argon2id m/t/p (client re-derivation)
}

// A device being enrolled. The private key for `device_public_key` stays in the
// device's OS keychain. `machine_label` is the thin slice-1 machine reference.
message DeviceEnrollment {
  string device_label = 1;
  string platform = 2;                // windows|macos|ios|android
  bytes device_public_key = 3;        // X25519
  string machine_label = 4;
}

// ── Bootstrap (first owner) ──────────────────────────────────────────────────
// Unauthenticated; rejected once any user exists. Creates the owner from
// client-generated crypto and enrolls the bootstrapping device, returning a
// session. Replaces `provision`'s owner creation.
message BootstrapRequest {
  string email = 1;
  string display_name = 2;
  string password = 3;                // over TLS; server stores an Argon2id verifier
  KeyMaterial key_material = 4;
  DeviceEnrollment device = 5;
}

// ── Login ────────────────────────────────────────────────────────────────────
message LoginRequest {
  string email = 1;
  string password = 2;                // over TLS
  // MFA second leg (contract-provisioned; unused in slice 1).
  string mfa_challenge_token = 3;
  bytes mfa_response = 4;
}

message Session {
  string token = 1;                   // opaque session token (slice 1)
  string user_id = 2;
  string expires_at = 3;              // RFC 3339
}

message MfaRequired {
  string mfa_challenge_token = 1;
  repeated string methods = 2;        // "totp" | "passkey"
}

message LoginResponse {
  oneof outcome {
    Session session = 1;
    MfaRequired mfa_required = 2;
  }
}

// The second leg of MFA login: the challenge token from `MfaRequired` plus the
// user's TOTP code (in `mfa_response`). On success the server issues a session.
message VerifyMfaRequest {
  string mfa_challenge_token = 1;
  bytes mfa_response = 2;
}

// ── TOTP authenticator management (authenticated) ─────────────────────────────
// Enroll → confirm a TOTP authenticator, list the verified ones, and remove
// them. Secrets are server-side encrypted at rest; only the base32 form + the
// otpauth URI (for the QR code) are ever returned, and only at enrollment.
message EnrollTotpResponse {
  string totp_id = 1;
  string secret_base32 = 2;
  string otpauth_uri = 3;
}
message ConfirmTotpRequest {
  string totp_id = 1;
  string code = 2;
  string label = 3;
}
message TotpFactor {
  string totp_id = 1;
  string label = 2;
  string created_at = 3;
  string last_used_at = 4;  // empty if never used
}
message ListTotpResponse {
  repeated TotpFactor factors = 1;
}
message RemoveTotpRequest {
  string totp_id = 1;
}

message GetKeyMaterialResponse {
  KeyMaterial key_material = 1;
}

// ── Devices ──────────────────────────────────────────────────────────────────
message RegisterDeviceRequest {
  DeviceEnrollment device = 1;
}

message Device {
  string device_id = 1;
  string device_label = 2;
  string platform = 3;
  string machine_id = 4;              // empty if none
  string created_at = 5;              // RFC 3339
  string last_seen_at = 6;            // empty if never
  string revoked_at = 7;              // empty if active
}

message ListMyDevicesResponse {
  repeated Device devices = 1;
}

message DeviceId {
  string device_id = 1;
}

// ── Account self-service ──────────────────────────────────────────────────────
// All authenticated (session token) and operate on the calling user.

// The calling user's profile (no secrets — public identity fields only).
message Profile {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string instance_role = 4;             // owner|admin|member
}

message UpdateDisplayNameRequest {
  string display_name = 1;
}

// Re-auth: changing the email requires the current password.
message UpdateEmailRequest {
  string new_email = 1;
  string current_password = 2;
}

// Changing the password recomputes the server's Argon2id verifier *and* re-wraps
// the master key client-side (2SKD): the client hands back a fresh wrap under
// KDF(new_password, secret_key). The private keys (wrapped under the unchanged
// master key) don't change, so only the master-key wrap + salt/params rotate.
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;              // server recomputes its Argon2id verifier
  bytes  new_master_key_wrapped = 3;    // client 2SKD re-wrap
  bytes  new_kdf_salt = 4;
  string new_kdf_params = 5;
}

// ── Avatar (E2E) ──────────────────────────────────────────────────────────────
// The account avatar, sealed CLIENT-SIDE under the user's master key (symmetric
// E2E). The server stores the opaque blob (one per user, overwrite) and serves
// it back — it never sees plaintext, only enforcing a byte cap.
message GetAvatarResponse { bytes avatar = 1; }  // empty bytes = no avatar set
message SetAvatarRequest  { bytes avatar = 1; }  // client-sealed blob

// The Hub's identity/enrollment service — core infrastructure, distinct from
// Platform/Resources. `Bootstrap` + `Login` are unauthenticated (peer-IP
// rate-limited server-side); the rest require the session token in
// `authorization: Bearer <token>` metadata and are owner-scoped.
service Account {
  rpc Bootstrap(BootstrapRequest) returns (Session);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc VerifyMfa(VerifyMfaRequest) returns (Session);
  rpc GetKeyMaterial(Empty) returns (GetKeyMaterialResponse);
  rpc RegisterDevice(RegisterDeviceRequest) returns (Device);
  rpc ListMyDevices(Empty) returns (ListMyDevicesResponse);
  rpc RevokeDevice(DeviceId) returns (Empty);

  // Account self-service (authenticated; operate on the calling user).
  rpc GetProfile(Empty) returns (Profile);
  rpc UpdateDisplayName(UpdateDisplayNameRequest) returns (Profile);
  rpc UpdateEmail(UpdateEmailRequest) returns (Profile);
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);

  // The account avatar: client-sealed under the master key (the server stores
  // only the opaque blob, one per user, overwrite).
  rpc GetAvatar(Empty) returns (GetAvatarResponse);
  rpc SetAvatar(SetAvatarRequest) returns (Empty);

  // TOTP authenticator management (authenticated; operate on the calling user).
  rpc EnrollTotp(Empty) returns (EnrollTotpResponse);
  rpc ConfirmTotp(ConfirmTotpRequest) returns (Empty);
  rpc ListTotp(Empty) returns (ListTotpResponse);
  rpc RemoveTotp(RemoveTotpRequest) returns (Empty);
}
