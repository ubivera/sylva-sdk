[package]
name = "sylva-sdk"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "Sylva client SDK — shared Rust core for Hearth clients (transport, 2SKD crypto, device enrollment). First consumed by Sylva Hub."
# License intentionally unset for now (deferred — see design/repos.md §Considerations).
publish = false

[lib]
name = "sylva_sdk"
path = "src/lib.rs"
# `cdylib` is the loadable library the C# bindings (uniffi-bindgen-cs) link
# against; `lib` (rlib) is what the e2e + other Rust consumers use. Only built
# when sylva-sdk is the top-level target, so dependents are unaffected.
crate-type = ["cdylib", "lib"]

[features]
# The uniffi FFI boundary for native shells (Sylva Hub). Off by default so the
# core SDK + the e2e build stay lean; turn on to compile the exported surface.
# Pulls the tokio runtime the blocking wrapper drives. (C# binding *generation*
# is a separate `uniffi-bindgen-cs` step in Phase 4.)
ffi = ["dep:uniffi", "tokio/rt-multi-thread", "tokio/net", "tokio/time"]

[dependencies]
# Client-side end-to-end crypto. Versions track sylva-hearth where shared so the
# wire/byte formats stay interoperable.
argon2 = "0.5"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# gRPC client stubs (generated from the vendored protos). Versions track
# sylva-hearth's proto crate (tonic 0.14 split codegen/runtime; tonic-prost is
# the codec, protox a pure-Rust .proto compiler so no system protoc is needed).
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
# Discovery is a plain-HTTP GET in dev; no TLS feature (avoids pulling an
# aws-lc-rs/NASM toolchain on Windows). HTTPS support is added with the TLS work.
reqwest = { version = "0.12", default-features = false }
# Per-OS-user secret storage. `windows-native` (the dev target) = Credential
# Manager; macOS/Linux backend features are added per target as those shells land.
keyring = { version = "3", features = ["windows-native"] }
# The facade holds an async `Mutex` over its connection/session state. The
# caller (or the 3.6b blocking wrapper) provides the runtime; the SDK needs only
# the sync primitives here (the `ffi` feature adds the runtime ones).
tokio = { version = "1", features = ["sync"] }
# FFI boundary for native shells, enabled by the `ffi` feature. Proc-macro mode
# (no UDL). C# bindings are generated by `uniffi-bindgen-cs` (Phase 4) — the
# version here must match that tool's supported uniffi version.
uniffi = { version = "0.28", optional = true }

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
# Async runtime + an in-process mock gRPC server for the transport tests.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
